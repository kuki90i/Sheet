<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лист</title>
<link rel="icon" type="image/svg+xml" href="Logo.svg">

<!-- ======== FIREBASE SDK ======== -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#fafaf8;
    --surface:#ffffff;
    --surface-2:#f1f0ec;
    --border:#e3e1da;
    --text:#171715;
    --text-dim:#747369;
    --accent:#2f6b4f;
    --accent-contrast:#ffffff;
    --accent-soft:#e7eee9;
    --danger:#c0392b;
    --danger-soft:#fbeae8;
    --success:#2f6b4f;

    --r-sm:8px;
    --r-md:12px;
    --r-lg:14px;

    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px; --s7:36px;

    --shadow:0 1px 2px rgba(20,20,15,0.04), 0 4px 14px rgba(20,20,15,0.05);
    --ease:cubic-bezier(.4,0,.2,1);
  }

  [data-theme="dark"]{
    --bg:#121210;
    --surface:#191917;
    --surface-2:#211f1c;
    --border:#2c2a26;
    --text:#f1f0ec;
    --text-dim:#8f8d84;
    --accent:#5fae84;
    --accent-contrast:#0d140f;
    --accent-soft:#1c2a22;
    --danger:#e2685d;
    --danger-soft:#2a1b19;
    --success:#5fae84;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    transition:background .3s var(--ease), color .3s var(--ease);
  }
  .hidden{display:none !important;}

  /* ===== ICONS ===== */
  .icon{width:18px; height:18px; display:inline-block; vertical-align:middle; flex-shrink:0;}
  .icon, .icon *{fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  .icon.sm{width:15px; height:15px;}
  .icon.lg{width:24px; height:24px;}
  .spin{animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== BRAND ===== */
  .brand{
    display:flex; align-items:baseline;
    font-weight:800; letter-spacing:-0.02em;
    color:var(--text); line-height:1; user-select:none;
  }
  .brand .dot{color:var(--accent); margin-left:1px;}
  .brand.sm{font-size:19px;}
  .brand.lg{font-size:32px;}

  /* ===== SPLASH ===== */
  #splash{
    position:fixed; inset:0; z-index:999;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .5s var(--ease), visibility .5s;
  }
  #splash.hide{opacity:0; visibility:hidden;}
  #splash .brand{animation:pulseMark 1.4s ease-in-out infinite;}
  @keyframes pulseMark{
    0%,100%{transform:scale(1); opacity:1;}
    50%{transform:scale(.93); opacity:.65;}
  }

  .container{max-width:720px; margin:0 auto; padding:0 var(--s5);}
  button{font-family:inherit;}

  /* ===== AUTH ===== */
  #authView{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:var(--s5);
    opacity:0;
    animation:fadeIn .5s var(--ease) .15s forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}
  .auth-shell{width:100%; max-width:380px;}
  .auth-header{display:flex; flex-direction:column; align-items:center; gap:var(--s3); margin-bottom:var(--s6); text-align:center; position:relative;}
  .auth-header p{margin:0; color:var(--text-dim); font-size:13.5px;}
  .theme-toggle{
    position:absolute; top:-4px; right:-4px;
    width:38px; height:38px; border-radius:var(--r-sm);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s, color .2s, transform .15s;
  }
  .theme-toggle:hover{color:var(--text); border-color:var(--text-dim);}
  .theme-toggle:active{transform:scale(.92);}

  .auth-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:var(--s6) var(--s5);
    box-shadow:var(--shadow);
  }
  .seg-tabs{
    display:grid; grid-template-columns:1fr 1fr;
    border:1px solid var(--border);
    border-radius:var(--r-sm);
    padding:3px;
    margin-bottom:var(--s5);
    background:var(--surface-2);
  }
  .seg-tabs button{
    padding:9px 0;
    border:none; background:transparent;
    border-radius:calc(var(--r-sm) - 3px);
    font-weight:600; font-size:13.5px;
    color:var(--text-dim);
    cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .seg-tabs button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}

  .field{margin-bottom:var(--s4);}
  .field label{
    display:block; font-size:11px; font-weight:600;
    color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;
    margin-bottom:var(--s2);
  }
  .input-wrap{position:relative;}
  input[type=text], input[type=password], input[type=number], select, textarea{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:var(--r-sm);
    font-size:14.5px;
    font-family:inherit;
    background:var(--surface-2);
    color:var(--text);
    outline:none;
    transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  input::placeholder, textarea::placeholder{color:var(--text-dim); opacity:.8;}
  input:focus, select:focus, textarea:focus{border-color:var(--accent); background:var(--surface);}
  .input-wrap input[type=password], .input-wrap input[type=text]{padding-right:42px;}
  .eye-btn{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border:none; background:transparent;
    color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border-radius:var(--r-sm);
    transition:color .2s, background .2s;
  }
  .eye-btn:hover{color:var(--text); background:var(--surface-2);}

  .error-msg{font-size:12.5px; min-height:16px; margin-bottom:var(--s3); transition:color .2s;}
  .error-msg.err{color:var(--danger);}
  .error-msg.ok{color:var(--success);}

  /* ===== BUTTONS ===== */
  .btn{
    cursor:pointer; border:none; border-radius:var(--r-sm);
    padding:11px 18px; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
    transition:background .2s var(--ease), transform .12s var(--ease), border-color .2s, color .2s, opacity .2s;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.6; cursor:default; transform:none;}
  .btn-primary{background:var(--text); color:var(--bg);}
  .btn-primary:hover:not(:disabled){opacity:.88;}
  .btn-accent{background:var(--accent); color:var(--accent-contrast);}
  .btn-accent:hover:not(:disabled){filter:brightness(1.07);}
  .btn.full{width:100%;}
  .btn-outline{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-outline:hover{border-color:var(--text-dim);}
  .btn-danger-ghost{background:transparent; color:var(--danger); border:1px solid transparent;}
  .btn-danger-ghost:hover{background:var(--danger-soft); border-color:var(--danger-soft);}
  .icon-btn{
    width:38px; height:38px; border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s, color .2s, transform .12s;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--text-dim);}
  .icon-btn:active{transform:scale(.92);}

  .del-btn{
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:var(--r-sm);
    color:var(--text-dim);
    cursor:pointer;
    flex-shrink:0;
    transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
  }
  .del-btn:hover{color:var(--danger); border-color:var(--danger); background:var(--danger-soft);}
  .del-btn:active{transform:scale(.88);}

  /* ===== APP SHELL ===== */
  #appView{display:none; min-height:100vh;}
  header.topbar{
    border-bottom:1px solid var(--border);
    background:var(--bg);
    position:sticky; top:0; z-index:20;
  }
  header.topbar .container{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:var(--s4); padding-bottom:var(--s4);
    gap:var(--s3); flex-wrap:wrap;
  }
  .user-row{display:flex; align-items:center; gap:var(--s2);}
  .username-label{font-size:13px; font-weight:600; color:var(--text-dim); margin-right:var(--s1);}

  .streak-chip{
    display:flex; align-items:center; gap:6px;
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--surface);
    font-size:13px; font-weight:700; color:var(--text);
    transition:transform .3s var(--ease), background .3s var(--ease), border-color .3s var(--ease);
  }
  .streak-chip .icon{color:var(--accent);}
  .streak-chip.bump{animation:streakPop .55s var(--ease);}
  @keyframes streakPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.25); background:var(--accent-soft); border-color:var(--accent);}
    70%{transform:scale(.94);}
    100%{transform:scale(1);}
  }

  .sync-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim); flex-shrink:0;
    transition:background .3s var(--ease);
  }
  .sync-dot.online{background:var(--accent); box-shadow:0 0 0 0 rgba(47,107,79,.4); animation:syncPulse 2s infinite;}
  @keyframes syncPulse{
    0%{box-shadow:0 0 0 0 rgba(47,107,79,.35);}
    70%{box-shadow:0 0 0 6px rgba(47,107,79,0);}
    100%{box-shadow:0 0 0 0 rgba(47,107,79,0);}
  }

  nav.tabs{
    border-bottom:1px solid var(--border);
    background:var(--bg);
    position:sticky; top:65px; z-index:19;
  }
  .tabs-inner{display:flex; width:100%;}
  .tabs-inner button{
    flex:1; padding:13px 6px;
    background:none; border:none;
    color:var(--text-dim); font-weight:600; font-size:13.5px;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:var(--s2);
    transition:color .2s var(--ease), border-color .2s var(--ease);
  }
  .tabs-inner button.active{color:var(--text); border-bottom-color:var(--accent);}
  .tabs-inner button:hover{color:var(--text);}

  @media (min-width:601px){
    .tabs-inner{max-width:720px; margin:0 auto; padding:0 var(--s5);}
  }

  main.container{padding-top:var(--s6); padding-bottom:120px;}

  @keyframes fadeSlideIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .animate-in{animation:fadeSlideIn .4s var(--ease);}

  /* ===== ACCORDION ===== */
  .accordion{
    border:1px solid var(--border);
    border-radius:var(--r-md);
    background:var(--surface);
    margin-bottom:var(--s4);
    overflow:hidden;
  }
  .accordion-header{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:var(--s4) var(--s5);
    background:none; border:none; cursor:pointer;
    text-align:left;
    transition:background .2s var(--ease);
  }
  .accordion-header:hover{background:var(--surface-2);}
  .accordion-title{display:flex; align-items:center; gap:var(--s3); font-weight:600; font-size:14.5px; color:var(--text);}
  .accordion-title .icon{color:var(--text-dim);}
  .accordion-badge{
    font-size:11px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:2px 8px;
    margin-left:var(--s2);
  }
  .chevron{color:var(--text-dim); transition:transform .3s var(--ease);}
  .accordion-header.active .chevron{transform:rotate(180deg); color:var(--text);}

  .accordion-panel{
    display:grid; grid-template-rows:0fr;
    transition:grid-template-rows .35s var(--ease);
    border-top:0 solid var(--border);
  }
  .accordion-panel.open{grid-template-rows:1fr; border-top:1px solid var(--border);}
  .accordion-panel-inner{overflow:hidden; min-height:0;}
  .accordion-content{padding:var(--s5);}

  .row{display:flex; gap:var(--s3); flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}
  .input-with-mic{position:relative;}
  .input-with-mic textarea{padding-right:46px;}
  .input-with-mic.no-mic textarea{padding-right:13px;}
  textarea{min-height:92px; resize:vertical; line-height:1.5;}
  .mic-btn{
    position:absolute; right:6px; top:6px;
    width:34px; height:34px; border-radius:var(--r-sm);
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.2s;
  }
  .mic-btn:hover{color:var(--text); border-color:var(--text-dim);}
  .mic-btn.recording{
    background:var(--danger); border-color:var(--danger); color:#fff;
    animation:pulseRec 1.1s infinite;
  }
  @keyframes pulseRec{
    0%{box-shadow:0 0 0 0 rgba(192,57,43,.4);}
    70%{box-shadow:0 0 0 10px rgba(192,57,43,0);}
    100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}
  }

  .list-row{
    display:flex; justify-content:space-between; align-items:center; gap:var(--s3);
    background:var(--surface-2);
    border-radius:var(--r-sm);
    padding:10px 14px;
    margin-bottom:var(--s2);
    font-size:13.5px;
    animation:fadeSlideIn .3s var(--ease);
  }
  .list-row .wname{font-weight:700; color:var(--text);}
  .list-row .wdesc{color:var(--text-dim);}

  .empty-note{color:var(--text-dim); font-size:13.5px; text-align:center; padding:var(--s6) 0;}

  .quiz-box{margin-top:var(--s4);}
  .quiz-progress{font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:var(--s2);}
  .quiz-question{font-size:15.5px; font-weight:700; margin:0 0 var(--s4);}
  .quiz-option{
    display:block; width:100%; text-align:left;
    background:var(--surface-2); border:1px solid transparent;
    border-radius:var(--r-sm); padding:11px 14px; margin-bottom:var(--s2);
    cursor:pointer; font-size:13.5px; color:var(--text);
    transition:.2s;
  }
  .quiz-option:hover:not(:disabled){border-color:var(--text-dim);}
  .quiz-option.correct{background:var(--accent-soft); border-color:var(--success); color:var(--accent); font-weight:700;}
  .quiz-option.wrong{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .quiz-option:disabled{cursor:default;}
  .quiz-result{font-size:14.5px; font-weight:700; margin-bottom:var(--s3);}

  .dict-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-md); padding:var(--s4) var(--s5);
    margin-bottom:var(--s3);
    display:flex; justify-content:space-between; align-items:flex-start; gap:var(--s3);
    animation:fadeSlideIn .35s var(--ease);
  }
  .dict-card .wname{font-weight:700; font-size:14.5px; margin-bottom:4px;}
  .dict-card .wdesc{font-size:13.5px; color:var(--text-dim); line-height:1.5;}

  .history-meta-row{display:flex; align-items:center; gap:var(--s2); font-size:12px; color:var(--text-dim); margin-top:2px;}
  .history-title{font-size:14.5px; font-weight:700;}
  .accordion-content h4{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-dim); margin:var(--s4) 0 var(--s2);
  }
  .accordion-content h4:first-child{margin-top:0;}
  .accordion-content p{margin:0; font-size:14px; line-height:1.6;}
  .history-actions{margin-top:var(--s4); display:flex; justify-content:flex-end;}

  footer.save-bar{
    position:sticky; bottom:0;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:var(--s5) 0 var(--s6);
  }
  footer.save-bar .container{display:flex; justify-content:center;}
  .btn-save{
    width:100%; max-width:420px; padding:14px;
    font-size:14.5px; box-shadow:var(--shadow);
    position:relative;
  }
  .btn-save [data-state-content]{display:none; align-items:center; gap:var(--s2);}
  .btn-save[data-state="idle"] [data-state-content="idle"]{display:inline-flex;}
  .btn-save[data-state="loading"] [data-state-content="loading"]{display:inline-flex;}
  .btn-save[data-state="success"] [data-state-content="success"]{display:inline-flex;}
  .btn-save[data-state="success"]{background:var(--success);}

  #toast{
    position:fixed; left:50%; bottom:28px; z-index:200;
    transform:translate(-50%, 20px);
    opacity:0; pointer-events:none;
    background:var(--text); color:var(--bg);
    padding:12px 18px; border-radius:var(--r-md);
    display:flex; align-items:center; gap:var(--s2);
    font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow);
    transition:opacity .3s var(--ease), transform .3s var(--ease);
  }
  #toast.show{opacity:1; transform:translate(-50%, 0);}
  #toast .icon{color:var(--accent);}
  #toast.err .icon{color:var(--danger);}

  @media (max-width:600px){
    .container{padding:0 var(--s4);}
    .accordion-content{padding:var(--s4);}
    nav.tabs{top:61px;}
  }
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="brand lg">Лист<span class="dot">.</span></div>
</div>

<!-- ============ AUTH VIEW ============ -->
<div id="authView">
  <div class="auth-shell">
    <div class="auth-header">
      <button class="theme-toggle" onclick="toggleTheme()" id="authThemeBtn" title="Сменить тему">
        <svg class="icon" viewBox="0 0 24 24" id="authThemeIcon"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <div class="brand lg">Лист<span class="dot">.</span></div>
      <p>Дневник чтения · синхронизация между устройствами</p>
    </div>

    <div class="auth-card">
      <div class="seg-tabs">
        <button id="tabLoginBtn" class="active" onclick="switchAuthTab('login')">Вход</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')">Регистрация</button>
      </div>

      <div id="loginForm">
        <div class="field">
          <label>Никнейм</label>
          <input type="text" id="loginUsername" placeholder="Введите ник">
        </div>
        <div class="field">
          <label>Пароль</label>
          <div class="input-wrap">
            <input type="password" id="loginPassword" placeholder="Введите пароль">
            <button type="button" class="eye-btn" onclick="togglePasswordVisibility('loginPassword', this)">
              <svg class="icon sm" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="error-msg" id="loginError"></div>
        <button class="btn btn-primary full" id="loginBtn" onclick="loginUser()">Войти</button>
      </div>

      <div id="registerForm" class="hidden">
        <div class="field">
          <label>Никнейм</label>
          <input type="text" id="regUsername" placeholder="Придумайте ник">
        </div>
        <div class="field">
          <label>Пароль</label>
          <div class="input-wrap">
            <input type="password" id="regPassword" placeholder="Придумайте пароль">
            <button type="button" class="eye-btn" onclick="togglePasswordVisibility('regPassword', this)">
              <svg class="icon sm" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="error-msg" id="regError"></div>
        <button class="btn btn-primary full" id="regBtn" onclick="registerUser()">Зарегистрироваться</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ MAIN APP VIEW ============ -->
<div id="appView">
  <header class="topbar">
    <div class="container">
      <div class="brand sm">Лист<span class="dot">.</span></div>
      <div class="user-row">
        <span class="username-label" id="currentUserLabel"></span>
        <div class="sync-dot" id="syncDot" title="Статус синхронизации"></div>
        <div class="streak-chip" id="streakChip" title="Серия сохранений">
          <svg class="icon sm" viewBox="0 0 24 24">

<script>
/* ========================================================
   FIREBASE INIT
======================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAgIDFHwZ7r4w-yq99CTuWc8ShnSqIyA8",
  authDomain: "sheet-f17cc.firebaseapp.com",
  databaseURL: "https://sheet-f17cc-default-rtdb.firebaseio.com",
  projectId: "sheet-f17cc",
  storageBucket: "sheet-f17cc.firebasestorage.app",
  messagingSenderId: "1016307575651",
  appId: "1:1016307575651:web:d72faf2485c26f9edfc156",
  measurementId: "G-LN7YMDDDEC"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ключ пользователя в базе — без запрещённых символов . # $ [ ] / */
function sanitizeKey(str){
  return str.trim().replace(/[.#$\[\]\/]/g, '_');
}
function userRef(key){ return db.ref('users/'+key); }

/* ========================================================
   ICONS / UTIL
======================================================== */
const ICONS = {
  trash: `<svg class="icon sm" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>`,
  close: `<svg class="icon sm" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>`,
  eye: `<svg class="icon sm" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeOff: `<svg class="icon sm" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4"/><path d="M6.6 6.6C4 8.3 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 4-1"/></svg>`,
};
const SUN = `<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="4"/>`;
const MOON = `<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>`;

function escapeHtml(str){
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function showToast(text, isError){
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  toast.classList.toggle('err', !!isError);
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toast.classList.remove('show'), 2600);
}

/* ========================================================
   MOBILE DETECTION — голосовой ввод только на телефонах
======================================================== */
function isMobileDevice(){
  const uaMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone/i.test(navigator.userAgent);
  const coarsePointer = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  return uaMobile || coarsePointer;
}

function stripVoiceInputOnDesktop(){
  if(isMobileDevice()) return;
  document.querySelectorAll('.mic-btn').forEach(btn=>{
    const wrap = btn.closest('.input-with-mic');
    btn.remove();
    if(wrap) wrap.classList.add('no-mic');
  });
}

/* ========================================================
   THEME
======================================================== */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const markup = theme === 'dark' ? SUN : MOON;
  const a = document.getElementById('authThemeIcon');
  const b = document.getElementById('appThemeIcon');
  if(a) a.innerHTML = markup;
  if(b) b.innerHTML = markup;
  localStorage.setItem('theme', theme);
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
(function initTheme(){
  const saved = localStorage.getItem('theme');
  if(saved){ applyTheme(saved); }
  else{
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }
})();

/* ========================================================
   SESSION (локально храним только "кто вошёл", данные — в Firebase)
======================================================== */
let currentKey = localStorage.getItem('currentKey') || null;
let currentDisplay = localStorage.getItem('currentDisplay') || null;

let booksData = {};
let historyData = {};
let dictData = {};
let lastStreakSeen = 0;
let activeListeners = [];

/* ========================================================
   SPLASH
======================================================== */
window.addEventListener('load', ()=>{
  setTimeout(()=> document.getElementById('splash').classList.add('hide'), 650);
});

/* ========================================================
   AUTH TABS / PASSWORD VISIBILITY
======================================================== */
function switchAuthTab(tab){
  document.getElementById('tabLoginBtn').classList.toggle('active', tab==='login');
  document.getElementById('tabRegisterBtn').classList.toggle('active', tab==='register');
  document.getElementById('loginForm').classList.toggle('hidden', tab!=='login');
  document.getElementById('registerForm').classList.toggle('hidden', tab!=='register');
}
function togglePasswordVisibility(inputId, btn){
  const input = document.getElementById(inputId);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.innerHTML = show ? ICONS.eyeOff : ICONS.eye;
}
function setError(elId, text, ok){
  const el = document.getElementById(elId);
  el.textContent = text;
  el.classList.toggle('err', !ok && !!text);
  el.classList.toggle('ok', !!ok);
}
function setBtnLoading(btn, loading, labelDefault){
  btn.disabled = loading;
  btn.textContent = loading ? 'Загрузка...' : labelDefault;
}

/* ========================================================
   REGISTER / LOGIN (через Realtime Database)
======================================================== */
async function registerUser(){
  const usernameRaw = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const btn = document.getElementById('regBtn');
  setError('regError','');
  if(!usernameRaw || !password){ setError('regError','Заполните все поля'); return; }

  const key = sanitizeKey(usernameRaw);
  setBtnLoading(btn, true, 'Зарегистрироваться');
  try{
    const snap = await userRef(key).once('value');
    if(snap.exists()){
      setError('regError','Такой ник уже занят');
      return;
    }
    await userRef(key).set({
      password,
      displayName: usernameRaw,
      streak: 0,
      createdAt: Date.now()
    });
    setError('regError','Успешно! Теперь войдите.', true);
    setTimeout(()=>{ switchAuthTab('login'); setError('regError',''); }, 900);
  }catch(e){
    console.error(e);
    setError('regError','Ошибка сети. Попробуйте ещё раз.');
  }finally{
    setBtnLoading(btn, false, 'Зарегистрироваться');
  }
}

async function loginUser(){
  const usernameRaw = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  setError('loginError','');
  if(!usernameRaw || !password){ setError('loginError','Заполните все поля'); return; }

  const key = sanitizeKey(usernameRaw);
  setBtnLoading(btn, true, 'Войти');
  try{
    const snap = await userRef(key).once('value');
    const data = snap.val();
    if(!data || data.password !== password){
      setError('loginError','Неверный ник или пароль');
      return;
    }
    currentKey = key;
    currentDisplay = data.displayName || usernameRaw;
    localStorage.setItem('currentKey', currentKey);
    localStorage.setItem('currentDisplay', currentDisplay);
    enterApp();
  }catch(e){
    console.error(e);
    setError('loginError','Ошибка сети. Попробуйте ещё раз.');
  }finally{
    setBtnLoading(btn, false, 'Войти');
  }
}

function logoutUser(){
  detachListeners();
  currentKey = null;
  currentDisplay = null;
  localStorage.removeItem('currentKey');
  localStorage.removeItem('currentDisplay');
  document.getElementById('appView').style.display = 'none';
  const authView = document.getElementById('authView');
  authView.style.display = 'flex';
  authView.style.opacity = '0';
  requestAnimationFrame(()=>{
    authView.style.transition = 'opacity .4s ease';
    authView.style.opacity = '1';
  });
}

/* ========================================================
   ENTER APP + REALTIME LISTENERS
======================================================== */
function detachListeners(){
  activeListeners.forEach(({ref, cb})=> ref.off('value', cb));
  activeListeners = [];
}

function enterApp(){
  document.getElementById('authView').style.display = 'none';
  const app = document.getElementById('appView');
  app.style.display = 'block';
  app.style.opacity = '0';
  requestAnimationFrame(()=>{
    app.style.transition = 'opacity .45s ease';
    app.style.opacity = '1';
  });
  document.getElementById('currentUserLabel').textContent = currentDisplay;

  const syncDot = document.getElementById('syncDot');

  // books listener
  const booksCb = (snap)=>{
    booksData = snap.val() || {};
    syncDot.classList.add('online');
    loadBooksFromData();
  };
  userRef(currentKey).child('books').on('value', booksCb);
  activeListeners.push({ref:userRef(currentKey).child('books'), cb:booksCb});

  // history listener
  const historyCb = (snap)=>{
    historyData = snap.val() || {};
    const historyTabVisible = !document.getElementById('historyTab').classList.contains('hidden');
    if(historyTabVisible) renderHistory();
  };
  userRef(currentKey).child('history').on('value', historyCb);
  activeListeners.push({ref:userRef(currentKey).child('history'), cb:historyCb});

  // dictionary listener
  const dictCb = (snap)=>{
    dictData = snap.val() || {};
    const dictTabVisible = !document.getElementById('dictTab').classList.contains('hidden');
    if(dictTabVisible) renderDict();
  };
  userRef(currentKey).child('dictionary').on('value', dictCb);
  activeListeners.push({ref:userRef(currentKey).child('dictionary'), cb:dictCb});

  // streak listener
  const streakCb = (snap)=>{
    const val = snap.val() || 0;
    const chip = document.getElementById('streakChip');
    document.getElementById('streakCount').textContent = val;
    if(val > lastStreakSeen){
      chip.classList.remove('bump');
      void chip.offsetWidth;
      chip.classList.add('bump');
    }
    lastStreakSeen = val;
  };
  userRef(currentKey).child('streak').on('value', streakCb);
  activeListeners.push({ref:userRef(currentKey).child('streak'), cb:streakCb});

  renderWords();
}

/* ========================================================
   TABS / ACCORDION
======================================================== */
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function switchMainTab(tab){
  ['home','history','dict'].forEach(t=>{
    document.getElementById(t+'Tab').classList.toggle('hidden', t!==tab);
    document.getElementById('nav'+capitalize(t)).classList.toggle('active', t===tab);
  });
  document.getElementById('saveBarHome').classList.toggle('hidden', tab!=='home');
  const section = document.getElementById(tab+'Tab');
  section.classList.remove('animate-in');
  void section.offsetWidth;
  section.classList.add('animate-in');
  if(tab==='history') renderHistory();
  if(tab==='dict') renderDict();
}

function toggleAccordion(key){
  document.getElementById('panel-'+key).classList.toggle('open');
  document.getElementById('header-'+key).classList.toggle('active');
}

/* ========================================================
   BOOKS
======================================================== */
function loadBooksFromData(){
  const select = document.getElementById('bookSelect');
  const prevValue = select.value;
  select.innerHTML = '';
  const names = Object.values(booksData);
  if(names.length === 0){
    select.innerHTML = '<option value="">Нет книг — добавьте первую</option>';
  }else{
    names.forEach(name=>{
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      select.appendChild(opt);
    });
    if(names.includes(prevValue)) select.value = prevValue;
  }
}

function addBook(){
  const input = document.getElementById('newBookName');
  const name = input.value.trim();
  if(!name) return;
  if(Object.values(booksData).includes(name)){
    input.value = '';
    return;
  }
  userRef(currentKey).child('books').push(name)
    .then(()=>{ input.value = ''; })
    .catch(()=> showToast('Не удалось добавить книгу', true));
}

/* ========================================================
   VOICE INPUT (только мобильные — кнопки уже удалены на ПК)
======================================================== */
function toggleVoice(targetId, btn){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert('Голосовой ввод не поддерживается в этом браузере.');
    return;
  }
  if(btn._recognizer && btn._recognizing){
    btn._recognizer.stop();
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'ru-RU';
  recognition.interimResults = false;
  recognition.continuous = false;

  btn._recognizer = recognition;
  btn._recognizing = true;
  btn.classList.add('recording');

  recognition.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    const field = document.getElementById(targetId);
    field.value = field.value ? field.value + ' ' + text : text;
  };
  recognition.onerror = ()=>{};
  recognition.onend = ()=>{
    btn._recognizing = false;
    btn.classList.remove('recording');
  };
  recognition.start();
}

/* ========================================================
   WORDS (временный список перед сохранением записи)
======================================================== */
let tempWords = [];

function addWord(){
  const nameEl = document.getElementById('wordName');
  const descEl = document.getElementById('wordDesc');
  const name = nameEl.value.trim();
  const desc = descEl.value.trim();
  if(!name || !desc){ alert('Введите название и описание слова'); return; }
  tempWords.push({name, desc});
  nameEl.value=''; descEl.value='';
  renderWords();
}
function removeTempWord(idx){
  tempWords.splice(idx,1);
  renderWords();
}
function renderWords(){
  const list = document.getElementById('wordsList');
  document.getElementById('wordsCountBadge').textContent = tempWords.length;
  list.innerHTML = '';
  if(tempWords.length === 0){
    list.innerHTML = '<div class="empty-note">Пока нет добавленных слов</div>';
    return;
  }
  tempWords.forEach((w,idx)=>{
    const div = document.createElement('div');
    div.className = 'list-row';
    div.innerHTML = `<span><span class="wname">${escapeHtml(w.name)}</span> — <span class="wdesc">${escapeHtml(w.desc)}</span></span>
      <button class="del-btn" onclick="removeTempWord(${idx})">${ICONS.close}</button>`;
    list.appendChild(div);
  });
}

/* ========================================================
   QUIZ
======================================================== */
function shuffle(arr){
  return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
}

function startQuiz(){
  const dictWords = Object.values(dictData || {});
  const combined = dictWords.concat(tempWords);
  const map = {};
  combined.forEach(w=> map[w.name] = w);
  const words = Object.values(map);

  if(words.length < 1){
    alert('Сначала добавьте хотя бы одно слово');
    return;
  }

  const quizWords = shuffle(words.filter(w => tempWords.some(tw=>tw.name===w.name)));
  const quizPool = quizWords.length ? quizWords : shuffle(words);

  let current = 0;
  let correctCount = 0;
  const area = document.getElementById('quizArea');
  area.classList.remove('hidden');

  function renderQuestion(){
    if(current >= quizPool.length){
      area.innerHTML = `<div class="quiz-result">Готово! Правильных ответов: ${correctCount} из ${quizPool.length}</div>
        <button class="btn btn-outline" onclick="document.getElementById('quizArea').classList.add('hidden')">Закрыть</button>`;
      return;
    }
    const word = quizPool[current];
    const others = words.filter(w=>w.name!==word.name);
    const wrongOptions = shuffle(others).slice(0,2).map(w=>w.desc);
    while(wrongOptions.length < 2) wrongOptions.push('Нет подходящего варианта');
    const options = shuffle([word.desc, ...wrongOptions]);

    area.innerHTML = `
      <div class="quiz-progress">Вопрос ${current+1} из ${quizPool.length}</div>
      <h4 class="quiz-question">Что означает слово «${escapeHtml(word.name)}»?</h4>
      <div id="optionsBox"></div>
    `;
    const box = document.getElementById('optionsBox');
    options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'quiz-option';
      b.textContent = opt;
      b.onclick = ()=>{
        const allBtns = box.querySelectorAll('.quiz-option');
        allBtns.forEach(x=>x.disabled = true);
        if(opt === word.desc){ b.classList.add('correct'); correctCount++; }
        else{
          b.classList.add('wrong');
          allBtns.forEach(x=>{ if(x.textContent === word.desc) x.classList.add('correct'); });
        }
        setTimeout(()=>{ current++; renderQuestion(); }, 850);
      };
      box.appendChild(b);
    });
  }
  renderQuestion();
}

/* ========================================================
   SAVE ENTRY → Firebase
======================================================== */
async function saveEntry(btn){
  const book = document.getElementById('bookSelect').value;
  const page = document.getElementById('pageInput').value;
  const summary = document.getElementById('summaryText').value.trim();
  const yesterday = document.getElementById('yesterdayText').value.trim();

  if(!book){ alert('Выберите или добавьте книгу'); return; }
  if(!summary && !yesterday){ alert('Добавьте хотя бы один пересказ'); return; }

  btn.disabled = true;
  btn.setAttribute('data-state','loading');

  const entry = {
    book, page, summary, yesterday,
    words: tempWords,
    date: new Date().toLocaleString('ru-RU'),
    ts: Date.now()
  };

  try{
    await userRef(currentKey).child('history').push(entry);

    if(tempWords.length){
      const existingNames = Object.values(dictData || {}).map(w=>w.name.toLowerCase());
      const updates = {};
      tempWords.forEach(w=>{
        if(!existingNames.includes(w.name.toLowerCase())){
          const newKey = db.ref().child('tmp').push().key;
          updates[newKey] = w;
        }
      });
      if(Object.keys(updates).length){
        await userRef(currentKey).child('dictionary').update(updates);
      }
    }

    const streakSnap = await userRef(currentKey).child('streak').once('value');
    const newStreak = (streakSnap.val() || 0) + 1;
    await userRef(currentKey).child('streak').set(newStreak);

    document.getElementById('pageInput').value='';
    document.getElementById('summaryText').value='';
    document.getElementById('yesterdayText').value='';
    tempWords = [];
    renderWords();
    document.getElementById('quizArea').classList.add('hidden');

    btn.setAttribute('data-state','success');
    showToast('Запись успешно сохранена');
  }catch(e){
    console.error(e);
    btn.setAttribute('data-state','idle');
    btn.disabled = false;
    showToast('Ошибка сохранения. Проверьте интернет.', true);
    return;
  }

  setTimeout(()=>{
    btn.setAttribute('data-state','idle');
    btn.disabled = false;
  }, 1500);
}

/* ========================================================
   HISTORY (чтение из historyData)
======================================================== */
function renderHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const entries = Object.entries(historyData || {}).sort((a,b)=>{
    const ta = a[1].ts || 0, tb = b[1].ts || 0;
    return tb - ta;
  });
  if(entries.length === 0){
    list.innerHTML = '<div class="empty-note">История пуста. Сохраните первую запись на главной странице.</div>';
    return;
  }
  entries.forEach(([id, entry])=>{
    const wrap = document.createElement('div');
    wrap.className = 'accordion';
    wrap.innerHTML = `
      <button class="accordion-header" id="hh-${id}" onclick="toggleHistoryBody('${id}')">
        <span class="accordion-title" style="flex-direction:column; align-items:flex-start; gap:2px;">
          <span class="history-title">${escapeHtml(entry.book)}</span>
          <span class="history-meta-row">Стр. ${entry.page || '—'} · ${entry.date}</span>
        </span>
        <svg class="icon chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="accordion-panel" id="hp-${id}">
        <div class="accordion-panel-inner">
          <div class="accordion-content">
            ${entry.summary ? `<h4>Краткий пересказ</h4><p>${escapeHtml(entry.summary)}</p>` : ''}
            ${entry.yesterday ? `<h4>Пересказ вчерашнего</h4><p>${escapeHtml(entry.yesterday)}</p>` : ''}
            ${entry.words && entry.words.length ? `<h4>Слова</h4>` + entry.words.map(w=>`<div class="list-row"><span><span class="wname">${escapeHtml(w.name)}</span> — <span class="wdesc">${escapeHtml(w.desc)}</span></span></div>`).join('') : ''}
            <div class="history-actions">
              <button class="btn btn-danger-ghost" onclick="deleteEntry('${id}', event)">${ICONS.trash} Удалить</button>
            </div>
          </div>
        </div>
      </div>
    `;
    list.appendChild(wrap);
  });
}

function toggleHistoryBody(id){
  document.getElementById('hp-'+id).classList.toggle('open');
  document.getElementById('hh-'+id).classList.toggle('active');
}

function deleteEntry(id, event){
  event.stopPropagation();
  if(!confirm('Удалить эту запись?')) return;
  userRef(currentKey).child('history').child(id).remove()
    .then(()=> showToast('Запись удалена'))
    .catch(()=> showToast('Не удалось удалить', true));
}

/* ========================================================
   DICTIONARY TAB
======================================================== */
function renderDict(){
  const list = document.getElementById('dictList');
  list.innerHTML = '';
  const entries = Object.entries(dictData || {});
  if(entries.length === 0){
    list.innerHTML = '<div class="empty-note">Словарь пуст. Добавляйте слова на главной странице.</div>';
    return;
  }
  entries.forEach(([id, w])=>{
    const div = document.createElement('div');
    div.className = 'dict-card';
    div.innerHTML = `
      <div>
        <div class="wname">${escapeHtml(w.name)}</div>
        <div class="wdesc">${escapeHtml(w.desc)}</div>
      </div>
      <button class="del-btn" onclick="deleteDictWord('${id}')">${ICONS.trash}</button>
    `;
    list.appendChild(div);
  });
}

function deleteDictWord(id){
  userRef(currentKey).child('dictionary').child(id).remove()
    .then(()=> showToast('Слово удалено'))
    .catch(()=> showToast('Не удалось удалить', true));
}

   INIT
======================================================== */
stripVoiceInputOnDesktop();

if(currentKey){
  enterApp();
}
