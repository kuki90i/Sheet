<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лист — Дневник чтения</title>
    <link rel="icon" href="Logo.svg" type="image/x-icon">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg-main: #09090b; --bg-card: #121214; --bg-input: #18181b; --text-main: #f4f4f5; --text-muted: #a1a1aa; --accent: #818cf8; --radius: 16px; --border: 1px solid rgba(255,255,255,0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(129, 140, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0); } }
        #authScreen { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--bg-card); border: var(--border); border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 360px; text-align: center; }
        #appScreen { display: none; } .card { background: var(--bg-card); border: var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 14px 16px; background: var(--bg-input); border: var(--border); border-radius: 12px; color: var(--text-main); font-size: 15px; margin-top: 8px; resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
        button { background: var(--bg-input); color: var(--text-main); border: var(--border); border-radius: 12px; padding: 14px 20px; font-size: 15px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--accent); color: #fff; border: none; width: 100%; padding: 16px; font-weight: 600; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; } .logo { font-size: 22px; font-weight: 700; } .logo span { color: var(--accent); } .btn-icon { padding: 10px; border-radius: 50%; width: 42px; height: 42px; }
        nav { display: flex; gap: 12px; margin-bottom: 24px; background: var(--bg-card); padding: 6px; border-radius: 16px; border: var(--border); } .nav-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 10px; border-radius: 10px; } .nav-btn.active { background: var(--bg-input); color: var(--text-main); }
        .view { display: none; } .view.active { display: block; animation: fadeIn 0.3s ease; }
        .header-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); } .streak { color: var(--accent); background: rgba(129, 140, 248, 0.1); padding: 6px 12px; border-radius: 20px; font-weight: 600; }
        .form-group { margin-bottom: 20px; } .form-group label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px; } .flex-row { display: flex; gap: 12px; align-items: flex-end; } .flex-row > div { flex: 1; }
        .quiz-card { border: 1px solid rgba(129, 140, 248, 0.25); } .quiz-empty { text-align: center; padding: 20px 0; color: var(--text-muted); font-size: 14px; } .quiz-progress { height: 4px; background: var(--bg-input); border-radius: 2px; overflow: hidden; margin-bottom: 16px; } .quiz-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; } .quiz-option { width: 100%; text-align: left; margin-bottom: 8px; justify-content: flex-start; padding: 14px 16px; } .quiz-option.correct { background: rgba(34,197,94,0.15); border-color: #22c55e; color: #4ade80; } .quiz-option.wrong { background: rgba(239,68,68,0.15); border-color: #ef4444; color: #f87171; }
        .word-toggle { width: 100%; background: transparent; border: 1px dashed rgba(255,255,255,0.2); margin-bottom: 20px; color: var(--text-muted); } #addWordForm { display: none; padding: 20px; background: var(--bg-input); border-radius: var(--radius); margin-bottom: 20px; }
        .list-item { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 6px; }
        #settingsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 100; justify-content: center; align-items: center; padding: 20px; } .modal-content { background: var(--bg-card); padding: 24px; border: var(--border); border-radius: var(--radius); width: 100%; max-width: 400px; }
        .textarea-wrapper { position: relative; } .mic-btn { position: absolute; right: 12px; bottom: 12px; background: rgba(255,255,255,0.06); border: none; } .mic-btn.recording { animation: pulse 1.5s infinite; background: rgba(239,68,68,0.25); color: #ef4444; }
        #syncStatus { font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="authScreen">
        <div class="auth-card">
            <div class="logo" style="font-size:32px; margin-bottom:8px;">Лист<span>.</span></div>
            <div style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">Один ник = ПК и телефон вместе</div>
            <input type="text" id="username" placeholder="Никнейм" autocomplete="off">
            <input type="password" id="password" placeholder="Пароль" style="margin-top:12px;">
            <button class="btn-primary" onclick="handleAuth()" style="margin-top:20px;">Войти / Создать</button>
            <div id="syncStatus" style="margin-top:12px;"></div>
        </div>
    </div>

    <div id="appScreen" class="container">
        <header><div class="logo">Лист<span>.</span></div><div style="display:flex; gap:10px; align-items:center;"><span id="displayUser" style="font-size:14px; color:var(--text-muted);"></span><button class="btn-icon" onclick="openSettings()">⚙️</button></div></header>
        <nav>
            <button class="nav-btn active" onclick="switchTab('today', this)">Сегодня</button>
            <button class="nav-btn" onclick="switchTab('history', this)">История</button>
            <button class="nav-btn" onclick="switchTab('dictionary', this)">Словарь</button>
        </nav>
        <main id="today" class="view active">
            <div class="header-stats"><span id="currentDate"></span><span class="streak" id="streakCount">🔥 0 дней</span></div>
            <div class="card">
                <div class="form-group flex-row"><div style="flex:3;"><label>Книга</label><select id="bookSelect"></select></div><button onclick="addBook()" style="flex:1; margin-top:24px;">＋ Новая</button></div>
                <div class="form-group"><label>Страница</label><input type="number" id="pageInput" placeholder="142"></div>
                <div class="form-group"><label>Вспомни вчерашнее</label><textarea id="yesterdayMemory" rows="2"></textarea></div>
                <div class="form-group textarea-wrapper" style="margin-bottom:0;"><label>Что запомнил сегодня?</label><textarea id="todayMemory" rows="4" placeholder="Пиши сюда..."></textarea><button id="micBtn" class="btn-icon mic-btn" onclick="toggleVoiceInput()" style="display:none;">🎤</button></div>
            </div>
            <div class="card quiz-card"><div style="display:flex; justify-content:space-between; margin-bottom:12px;"><strong style="color:var(--accent);">Мини-тест</strong><span id="quizCounter" style="font-size:13px; color:var(--text-muted);"></span></div><div id="quizEmptyState" class="quiz-empty">Добавь 3 слова чтобы начать тест.</div><div id="quizActiveState" style="display:none;"><div class="quiz-progress"><div class="quiz-bar" id="quizBar"></div></div><p id="quizWord" style="font-size:20px; font-weight:600; margin-bottom:16px; text-align:center;"></p><div id="quizOptions"></div></div></div>
            <button class="word-toggle" onclick="toggleAddWord()">＋ Сохранить новое слово</button><div id="addWordForm"><input type="text" id="newWord" placeholder="Слово" style="margin-bottom:12px;"><input type="text" id="newMeaning" placeholder="Объяснение" style="margin-bottom:16px;"><button class="btn-primary" onclick="saveWord()">Добавить</button></div>
            <button class="btn-primary" onclick="saveDay()" style="margin-bottom:40px;">✓ Завершить чтение</button>
        </main>
        <main id="history" class="view"><div class="card"><h2 style="margin-bottom:16px; font-size:18px;">История</h2><div id="historyList"></div></div></main>
        <main id="dictionary" class="view"><div class="card"><h2 style="margin-bottom:16px; font-size:18px;">Словарь</h2><div id="dictList"></div></div></main>
    </div>
    <div id="settingsModal"><div class="modal-content"><h2 style="margin-bottom:16px;">Аккаунт</h2><p id="fbStatus" style="font-size:12px; color:var(--text-muted); margin-bottom:16px;"></p><button onclick="handleLogout()" style="width:100%; margin-bottom:12px; border-color:#ef4444; color:#f87171; background:rgba(239,68,68,0.1);">Выйти</button><button onclick="closeSettings()" style="width:100%; background:#27272a;">Закрыть</button></div></div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAgIDFHwZ7r4w-yq99CTuWc8ShnSqIyA8",
      authDomain: "sheet-f17cc.firebaseapp.com",
      databaseURL: "https://sheet-f17cc-default-rtdb.firebaseio.com",
      projectId: "sheet-f17cc",
      storageBucket: "sheet-f17cc.firebasestorage.app",
      messagingSenderId: "1016307575651",
      appId: "1:1016307575651:web:d72faf2485c26f9edfc156",
      measurementId: "G-LN7YMDDDEC"
    };
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.database(); document.getElementById('fbStatus').innerText = "Облако подключено: " + firebaseConfig.databaseURL; } catch(e){ document.getElementById('fbStatus').innerText = "Облако не подключено: " + e.message; }

    const DEFAULT_DATA = { books: [], lastBook: "", words: [], history: [], streak: { count: 0, lastDate: "" }, draft: { page: "", yesterday: "", today: "" } };
    
    function toArray(v){
        if(Array.isArray(v)) return v.filter(Boolean);
        if(v == null) return [];
        if(typeof v === 'object') return Object.values(v).filter(Boolean);
        return [];
    }
    function normalizeData(raw){
        if(!raw || typeof raw !== 'object') return JSON.parse(JSON.stringify(DEFAULT_DATA));
        return {
            books: toArray(raw.books),
            lastBook: typeof raw.lastBook === 'string' ? raw.lastBook : "",
            words: toArray(raw.words),
            history: toArray(raw.history),
            streak: (raw.streak && typeof raw.streak === 'object') ? { count: Number(raw.streak.count)||0, lastDate: raw.streak.lastDate||"" } : { count:0, lastDate:"" },
            draft: (raw.draft && typeof raw.draft === 'object') ? { page: String(raw.draft.page||""), yesterday: String(raw.draft.yesterday||""), today: String(raw.draft.today||"") } : { page:"", yesterday:"", today:"" },
            _meta: raw._meta || null
        };
    }

    let currentUser = null;
    let appData = normalizeData(null);
    let fbRef = null;

    function handleAuth(){
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value.trim();
        if(!user || pass.length < 2) return alert("Введи ник и пароль от 2 символов");
        currentUser = user;
        localStorage.setItem('listActiveUser', user);
        localStorage.setItem('listActivePass', btoa(pass));
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
        document.getElementById('displayUser').innerText = "@" + currentUser;
        
        const local = localStorage.getItem('listData_'+currentUser);
        if(local){ try{ appData = normalizeData(JSON.parse(local)); }catch(e){ appData = normalizeData(null); } }
        initUI(); initVoiceRecognition(); initAutoSave(); initQuiz();

        if(db){
            if(fbRef) fbRef.off();
            fbRef = db.ref('users/'+currentUser);
            document.getElementById('syncStatus').innerText = "Подключаюсь к облаку...";
            fbRef.on('value', snap => {
                const val = snap.val();
                if(val){
                    if(val._meta && val._meta.password && val._meta.password !== btoa(pass)){
                        alert("Неверный пароль для этого ника!");
                        handleLogout();
                        return;
                    }
                    appData = normalizeData(val);
                    localStorage.setItem('listData_'+currentUser, JSON.stringify(appData));
                    initUI(); initQuiz();
                    document.getElementById('syncStatus').innerText = "";
                } else {
                    document.getElementById('syncStatus').innerText = "База пустая, первое сохранение создаст данные";
                    saveData();
                }
            }, err => {
                console.error(err);
                alert("Ошибка чтения из Firebase. Проверь вкладку Rules - должно быть true.");
            });
        }
    }

    function saveData(){
        if(!currentUser) return;
        try{
            if(!appData) appData = normalizeData(null);
            appData._meta = { password: localStorage.getItem('listActivePass')||"", updated: Date.now() };
            localStorage.setItem('listData_'+currentUser, JSON.stringify(appData));
            if(db && fbRef){
                fbRef.set(appData).catch(e=>{
                    console.error("Write error", e);
                    alert("Не удалось сохранить в облако: " + e.message);
                });
            }
        }catch(e){ console.error("saveData error", e); }
    }

    function handleLogout(){ if(fbRef) fbRef.off(); currentUser = null; fbRef = null; localStorage.removeItem('listActiveUser'); document.getElementById('appScreen').style.display='none'; document.getElementById('authScreen').style.display='flex'; closeSettings(); }

    window.onload = () => {
        const u = localStorage.getItem('listActiveUser'); const p = localStorage.getItem('listActivePass');
        if(u && p){ document.getElementById('username').value = u; try{ document.getElementById('password').value = atob(p); }catch(e){} handleAuth(); }
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'});
    };

    function initUI(){
        appData = normalizeData(appData);
        document.getElementById('streakCount').innerText = `🔥 ${(appData.streak.count||0)} дн. подряд`;
        const sel = document.getElementById('bookSelect');
        sel.innerHTML = appData.books.length ? '' : '<option value="">Нет книг</option>';
        appData.books.forEach(b=>{ const o=document.createElement('option'); o.value=o.textContent=b; if(b===appData.lastBook) o.selected=true; sel.appendChild(o); });
        document.getElementById('pageInput').value = appData.draft.page||""; document.getElementById('yesterdayMemory').value = appData.draft.yesterday||""; document.getElementById('todayMemory').value = appData.draft.today||"";
        renderHistory(); renderDict();
    }
    function switchTab(id, btn){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById(id).classList.add('active'); if(btn) btn.classList.add('active'); if(id==='history') renderHistory(); if(id==='dictionary') renderDict(); }
    function addBook(){ const t=prompt("Название книги:"); if(t && t.trim() && !appData.books.includes(t.trim())){ appData.books.push(t.trim()); appData.lastBook=t.trim(); saveData(); initUI(); } }
    function toggleAddWord(){ const f=document.getElementById('addWordForm'); f.style.display = f.style.display==='block'?'none':'block'; }
    function saveWord(){ const w=document.getElementById('newWord').value.trim(); const m=document.getElementById('newMeaning').value.trim(); if(w&&m){ appData.words.push({id:Date.now(), word:w, meaning:m}); saveData(); document.getElementById('newWord').value=""; document.getElementById('newMeaning').value=""; toggleAddWord(); initQuiz(); } }
    function saveDay(){
        const book = document.getElementById('bookSelect').value;
        if(!book) return alert("Сначала добавь книгу");
        appData.history = toArray(appData.history);
        const entry = { date: new Date().toLocaleDateString('ru-RU'), book, page: document.getElementById('pageInput').value, yesterdayText: document.getElementById('yesterdayMemory').value, todayText: document.getElementById('todayMemory').value };
        const idx = appData.history.findIndex(h=>h && h.date===entry.date);
        if(idx!==-1) appData.history[idx]=entry; else appData.history.unshift(entry);
        const todayStr = new Date().toDateString();
        if(appData.streak.lastDate !== todayStr){ appData.streak.count = (appData.streak.count||0)+1; appData.streak.lastDate = todayStr; }
        appData.lastBook = book; appData.draft = { page:"", yesterday:"", today:"" };
        saveData(); initUI(); alert("Сохранено! Теперь появится на телефоне.");
    }
    function initAutoSave(){ const map={pageInput:'page', yesterdayMemory:'yesterday', todayMemory:'today'}; Object.keys(map).forEach(id=>{ const el=document.getElementById(id); if(!el) return; el.addEventListener('input', e=>{ appData.draft[map[id]] = e.target.value; saveData(); }); }); }
    let recognition; function initVoiceRecognition(){ const SR = window.SpeechRecognition || window.webkitSpeechRecognition; const btn=document.getElementById('micBtn'); if(SR){ btn.style.display='block'; recognition=new SR(); recognition.lang='ru-RU'; recognition.onresult=e=>{ const ta=document.getElementById('todayMemory'); ta.value += (ta.value?" ":"")+e.results[0][0].transcript+"."; appData.draft.today=ta.value; saveData(); btn.classList.remove('recording'); }; recognition.onend=recognition.onerror=()=>btn.classList.remove('recording'); } }
    function toggleVoiceInput(){ if(!recognition) return alert("Голос работает только в Chrome/Edge по https://"); document.getElementById('micBtn').classList.add('recording'); recognition.start(); }
    let quizState={currentStep:0, maxSteps:5}; function initQuiz(){ const empty=document.getElementById('quizEmptyState'); const active=document.getElementById('quizActiveState'); const counter=document.getElementById('quizCounter'); if(!appData.words || appData.words.length<3){ empty.style.display='block'; active.style.display='none'; counter.innerText=`${(appData.words||[]).length}/3 слов`; return; } empty.style.display='none'; active.style.display='block'; quizState.currentStep=0; quizState.maxSteps=Math.min(5, appData.words.length); nextQuizQuestion(); }
    function nextQuizQuestion(){ if(quizState.currentStep>=quizState.maxSteps){ document.getElementById('quizActiveState').innerHTML=`<div style="text-align:center; padding:20px 0;"><div style="font-size:32px;">🎯</div><p>Тест пройден!</p><button onclick="initQuiz()" style="margin-top:12px;">Еще раз</button></div>`; document.getElementById('quizCounter').innerText=""; return; } let copy=[...appData.words].sort(()=>0.5-Math.random()); let correct=copy[0]; let wrong=copy.slice(1,3); let opts=[{text:correct.meaning, correct:true}, {text:wrong[0].meaning, correct:false}, {text:(wrong[1]&&wrong[1].meaning)||"Другое значение", correct:false}].sort(()=>0.5-Math.random()); document.getElementById('quizCounter').innerText=`${quizState.currentStep+1}/${quizState.maxSteps}`; document.getElementById('quizBar').style.width=`${(quizState.currentStep/quizState.maxSteps)*100}%`; document.getElementById('quizWord').innerText=correct.word; const cont=document.getElementById('quizOptions'); cont.innerHTML=''; opts.forEach(o=>{ const b=document.createElement('button'); b.className='quiz-option'; b.innerText=o.text; b.onclick=()=>{ cont.querySelectorAll('button').forEach(x=>x.disabled=true); if(o.correct){ b.classList.add('correct'); setTimeout(()=>{ quizState.currentStep++; nextQuizQuestion(); },500); }else{ b.classList.add('wrong'); setTimeout(()=>{ cont.querySelectorAll('button').forEach(x=>x.disabled=false); b.classList.remove('wrong'); },800); } }; cont.appendChild(b); }); }
    function renderHistory(){ const c=document.getElementById('historyList'); const hist=toArray(appData.history); if(!hist.length){ c.innerHTML='<p style="color:var(--text-muted); font-size:14px;">История пуста</p>'; return; } c.innerHTML=''; hist.forEach((h,i)=>{ if(!h) return; const d=document.createElement('div'); d.className='list-item'; d.innerHTML=`<div style="display:flex; justify-content:space-between;"><span>${h.date||''}</span><span style="font-size:12px; background:var(--bg-input); padding:4px 8px; border-radius:6px;">Стр. ${h.page||'?'}</span></div><div style="color:var(--accent); font-size:14px;">${h.book||''}</div><div style="font-size:14px; color:var(--text-muted);">${h.todayText||'Без заметок'}</div><div style="text-align:right;"><button onclick="if(confirm('Удалить?')){appData.history.splice(${i},1); saveData(); renderHistory();}">Удалить</button></div>`; c.appendChild(d); }); }
    function renderDict(){ const c=document.getElementById('dictList'); const words=toArray(appData.words); if(!words.length){ c.innerHTML='<p style="color:var(--text-muted); font-size:14px;">Словарь пуст</p>'; return; } c.innerHTML=''; words.forEach((w,i)=>{ if(!w) return; const d=document.createElement('div'); d.className='list-item'; d.innerHTML=`<div style="font-weight:500;">${w.word}</div><div style="font-size:14px; color:var(--text-muted);">${w.meaning}</div><div style="text-align:right;"><button onclick="if(confirm('Удалить?')){appData.words.splice(${i},1); saveData(); renderDict(); initQuiz();}">Удалить</button></div>`; c.appendChild(d); }); }
    function openSettings(){ document.getElementById('settingsModal').style.display='flex'; } function closeSettings(){ document.getElementById('settingsModal').style.display='none'; }
</script>
</body>
</html>
